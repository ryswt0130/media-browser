<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>View Media</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:; media-src 'self' file:; frame-src 'self' file:;">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="media-page-container">
        <div id="media-viewer-main-content">
            <div id="media-controls">
                <div id="app-title-header" class="app-title"></div>
                <button id="back-to-grid-btn">トップに戻る</button>
                <button id="media-favorite-btn">☆</button>
            </div>
            <div id="player-with-title-area">
                <div id="media-viewer-container">
                    <!-- Media will be loaded here by mediaRenderer.js -->
                    <p id="media-loading-message">Loading media...</p>
                    <h2 id="media-title-display" class="media-page-title"></h2>
                </div>
            </div>
            <!-- <div class="flex-spacer" style="flex-grow: 1;"></div> DELETED -->
        </div>
        <div id="media-recommendations-sidebar">
            <div id="memo-section">
                <h3>メモ</h3>
                <!-- Input Area -->
                <textarea id="memo-textarea" rows="5" placeholder="Add a new memo entry..."></textarea> 
                <div id="memo-controls"> <!-- Wrapper for buttons -->
                    <button id="insert-timestamp-btn">タイムスタンプ</button>  <!-- Moved first -->
                    <button id="save-memo-btn">保存</button> <!-- Moved second -->
                    <span id="save-status-message"></span>
                </div>

                <!-- Display Area for all saved memo content -->
                <div class="memo-subheading-controls">
                    <h4>メモ欄</h4>
                    <button id="copy-memo-btn">メモをコピー</button>
                    <span id="memo-status-message"></span> <!-- Added here -->
                </div>
                <div id="memo-display-area" class="memo-content-display"></div>
            </div>
            <hr style="margin-bottom: 20px;"> <!-- Optional: add a horizontal rule for separation -->
            <div id="recommendations-section">
                <h2>おすすめ</h2>
                <div id="recommendations-grid">
                    <!-- Recommended items will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    <script src="mediaRenderer.js"></script>
</body>
</html>
